name: MacHackerToolkit
options:
  bundleIdPrefix: com.worldhackerlabs
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: "$(TARGET_NAME)"
    INFOPLIST_FILE: MacHackerToolkit/SupportingFiles/Info.plist
    CODE_SIGN_ENTITLEMENTS: MacHackerToolkit/SupportingFiles/MacHackerToolkit.entitlements
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: "YES"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: dwarf
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  MacHackerToolkit:
    type: application
    platform: macOS
    sources:
      - path: MacHackerToolkit/Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MacHackerToolkit/Sources/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worldhackerlabs.machackertoolkit
        INFOPLIST_FILE: MacHackerToolkit/SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacHackerToolkit/SupportingFiles/MacHackerToolkit.entitlements
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - sdk: CoreWLAN.framework
      - sdk: IOBluetooth.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
      - sdk: Network.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: CoreML.framework
      - sdk: Charts.framework
      - sdk: SwiftUI.framework

  MacHackerToolkitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacHackerToolkit/Tests
    dependencies:
      - target: MacHackerToolkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.worldhackerlabs.machackertoolkit.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacHackerToolkit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MacHackerToolkit"

schemes:
  MacHackerToolkit:
    build:
      targets:
        MacHackerToolkit: all
        MacHackerToolkitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release