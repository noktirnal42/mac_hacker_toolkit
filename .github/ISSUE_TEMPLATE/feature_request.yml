name: Feature Request
description: Request a new feature for Mac Hacker Toolkit
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Description
        Describe the feature you'd like to see added.

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      placeholder: "What problem does this solve?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      placeholder: "How would you solve it?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      placeholder: "What alternatives were considered?"

  - type: checkboxes
    id: terms
    attributes:
      label: "Code of Conduct"
      options:
        - label: "I agree to follow the Code of Conduct"
          required: true