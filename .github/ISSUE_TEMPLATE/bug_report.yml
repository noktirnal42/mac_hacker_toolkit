name: Bug Report
description: Report a bug in Mac Hacker Toolkit
title: "[Bug] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        Please describe the bug clearly.

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      placeholder: "What should happen"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      placeholder: "What actually happens"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "App Version"
      placeholder: "e.g., 1.0.3"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: "macOS Version"
      placeholder: "e.g., 14.4"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Crash Log / Error Output"
      placeholder: "Paste relevant logs here"

  - type: checkboxes
    id: terms
    attributes:
      label: "Code of Conduct"
      options:
        - label: "I agree to follow the Code of Conduct"
          required: true