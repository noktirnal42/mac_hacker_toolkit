name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    name: Build macOS App
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -scheme MacHackerToolkit -configuration Release build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacHackerToolkit.app
          path: ~/Library/Developer/Xcode/DerivedData/MacHackerToolkit-*/Build/Products/Release/MacHackerToolkit.app
          retention-days: 7

  test:
    name: Run Tests
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test
        run: xcodebuild test -scheme MacHackerToolkit -destination 'platform=macOS'

  create-dmg:
    name: Create DMG Package
    runs-on: macos-14
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: MacHackerToolkit.app

      - name: Create DMG
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/v//')
          DATE=$(date +"%Y-%m-%d")
          DMG_NAME="MacHackerToolkit-${VERSION}-${DATE}"

          hdiutil create -volname "Mac Hacker Toolkit ${VERSION}" \
            -srcfolder MacHackerToolkit.app \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            "${DMG_NAME}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MacHackerToolkit-DMG
          path: "*.dmg"
          retention-days: 30

  release:
    name: Create Release
    runs-on: macos-14
    needs: [build, test, create-dmg]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: MacHackerToolkit-DMG

      - name: Create Checksum
        run: shasum -a 256 *.dmg > CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.dmg
            CHECKSUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}